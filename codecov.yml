# Excludes paths that are never worth unit-testing directly from the
# repo-wide coverage calculation, per the periodic hygiene review in #89:
#   - zz_generated.*.go: generated deepcopy/managed/managedlist/resolvers
#     boilerplate (regenerated by `make generate`, never hand-edited).
#   - internal/controller/*/fake: hand-written test doubles, not a test
#     target themselves.
#   - cmd/provider: the binary entrypoint (flag parsing, manager wiring),
#     exercised by `make e2e.run`/acceptance tests rather than unit tests.
#   - apis/azuredevops.go, apis/*/v1alpha1/groupversion_info.go,
#     apis/v1alpha1/register.go, internal/controller/azuredevops.go:
#     scheme/controller registration wiring with no branching logic.
ignore:
  - "**/zz_generated.*.go"
  - "internal/controller/*/fake/**"
  - "cmd/provider/**"
  - "apis/azuredevops.go"
  - "apis/*/v1alpha1/groupversion_info.go"
  - "apis/v1alpha1/register.go"
  - "internal/controller/azuredevops.go"

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false
