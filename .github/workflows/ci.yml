name: CI

on:
  push:
    branches:
      - main
      - release-*
    tags:
      - 'v*'
  pull_request: {}
  workflow_dispatch: {}

env:
  # Common versions
  GO_VERSION: '1.26.8'
  GOLANGCI_VERSION: 'v2.12.2'
  DOCKER_BUILDX_VERSION: 'v0.23.0'

  # Common users. We can't run a step 'if secrets.XXX != ""' but we can run a
  # step 'if env.XXX' != ""', so we copy these to succinctly test whether
  # credentials have been provided before trying to run steps that need them.
  UPBOUND_MARKETPLACE_PUSH_ROBOT_USR: ${{ secrets.UPBOUND_MARKETPLACE_PUSH_ROBOT_USR }}
jobs:
  detect-noop:
    runs-on: ubuntu-22.04
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      - name: Detect No-op Changes
        id: noop
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["**.md", "**.png", "**.jpg"]'
          do_not_skip: '["workflow_dispatch", "schedule", "push"]'


  lint:
    runs-on: ubuntu-22.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find the Go Build Cache
        id: go
        run: echo "cachedir=$(make go.cachedir)" >> $GITHUB_ENV

      - name: Cache the Go Build Cache
        uses: actions/cache@v6
        with:
          path: ${{ env.cachedir }}
          key: ${{ runner.os }}-build-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-lint-

      - name: Cache Go Dependencies
        uses: actions/cache@v6
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Download Go Modules
        run: make modules.download modules.check

      # We could run 'make lint' but we prefer this action because it leaves
      # 'annotations' (i.e. it comments on PRs to point out linter violations).
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_VERSION }}

  check-diff:
    runs-on: ubuntu-22.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find the Go Build Cache
        id: go
        run: echo "cachedir=$(make go.cachedir)" >> $GITHUB_ENV

      - name: Cache the Go Build Cache
        uses: actions/cache@v6
        with:
          path: ${{ env.cachedir }}
          key: ${{ runner.os }}-build-check-diff-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-check-diff-

      - name: Cache Go Dependencies
        uses: actions/cache@v6
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Download Go Modules
        run: make modules.download modules.check

      - name: Check Diff
        id: check-diff
        run: |
          mkdir _output
          make check-diff

      - name: Show diff
        if: failure() && steps.check-diff.outcome == 'failure'
        run: git diff

  unit-tests:
    runs-on: ubuntu-22.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Fetch History
        run: git fetch --prune --unshallow

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find the Go Build Cache
        id: go
        run: echo "cachedir=$(make go.cachedir)" >> $GITHUB_ENV

      - name: Cache the Go Build Cache
        uses: actions/cache@v6
        with:
          path: ${{ env.cachedir }}
          key: ${{ runner.os }}-build-unit-tests-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-unit-tests-

      - name: Cache Go Dependencies
        uses: actions/cache@v6
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Download Go Modules
        run: make modules.download modules.check

      - name: Run Unit Tests
        run: make -j2 test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          file: _output/tests/linux_amd64/coverage.txt

  publish-artifacts:
    runs-on: ubuntu-22.04
    needs: detect-noop
    # Only publish on pushes to main/release branches or tags, or when
    # explicitly dispatched (release-please.yml dispatches this workflow on
    # a release tag, since a tag pushed by GITHUB_TOKEN doesn't trigger
    # other workflows on its own) -- never on pull_request events. This job
    # pushes real package artifacts to GHCR/Upbound, which must never
    # happen for an untrusted/in-review PR build.
    if: needs.detect-noop.outputs.noop != 'true' && github.event_name != 'pull_request'
    permissions:
      contents: read
      # Needed to push the built package to GitHub Container Registry.
      packages: write

    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Upbound
        uses: docker/login-action@v4
        if: env.UPBOUND_MARKETPLACE_PUSH_ROBOT_USR != ''
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.UPBOUND_MARKETPLACE_PUSH_ROBOT_USR }}
          password: ${{ secrets.UPBOUND_MARKETPLACE_PUSH_ROBOT_PSW }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Fetch History
        run: git fetch --prune --unshallow

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Find the Go Build Cache
        id: go
        run: echo "cachedir=$(make go.cachedir)" >> $GITHUB_ENV

      - name: Cache the Go Build Cache
        uses: actions/cache@v6
        with:
          path: ${{ env.cachedir }}
          key: ${{ runner.os }}-build-publish-artifacts-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-publish-artifacts-

      - name: Cache Go Dependencies
        uses: actions/cache@v6
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Download Go Modules
        run: make modules.download modules.check

      - name: Build Artifacts
        run: make -j2 build.all
        env:
          # We're using docker buildx, which doesn't actually load the images it
          # builds by default. Specifying --load does so.
          BUILD_ARGS: "--load"

      - name: Publish Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: _output/**

      - name: Publish Artifacts
        # Runs on every push to main/release-* (publishing an unstable,
        # git-describe-versioned package on the "main" channel) and on every
        # "v*" tag (a real release). BRANCH_NAME is overridden to "main" for
        # tag builds because publish.artifacts is gated on BRANCH_NAME
        # matching RELEASE_BRANCH_FILTER (main/master/release-%), which a
        # tag ref name like "v0.1.0" wouldn't otherwise match -- the actual
        # package VERSION is still derived correctly from the tag via
        # `git describe --tags`.
        #
        # XPKG_REG_ORGS is expanded here (rather than relying solely on the
        # Makefile's default) to also push to Upbound's registry
        # (xpkg.upbound.io/cd0486) when valid robot credentials are present
        # -- see the "Login to Upbound" step above and RELEASING.md's
        # "Upbound Marketplace" section (#43).
        run: |
          XPKG_REG_ORGS="ghcr.io/dunkin0486"
          if [[ -n "${UPBOUND_MARKETPLACE_PUSH_ROBOT_USR}" ]]; then
            XPKG_REG_ORGS="${XPKG_REG_ORGS} xpkg.upbound.io/cd0486"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            make publish BRANCH_NAME=main XPKG_REG_ORGS="${XPKG_REG_ORGS}"
          else
            make publish BRANCH_NAME=${GITHUB_REF##*/} XPKG_REG_ORGS="${XPKG_REG_ORGS}"
          fi

      - name: Install up CLI
        # Pinned version, from the official Upbound CDN (same trust model as
        # the other curl-installed tools in this workflow). Only needed to
        # attach Marketplace extensions (icon, etc.) below.
        if: env.UPBOUND_MARKETPLACE_PUSH_ROBOT_USR != ''
        env:
          UP_VERSION: v0.51.0
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSLo /usr/local/bin/up \
            "https://cli.upbound.io/stable/${UP_VERSION}/bin/linux_amd64/up"
          chmod +x /usr/local/bin/up
          up version --client

      - name: Append Marketplace Extensions
        # `up alpha xpkg append` is currently the only way to attach a
        # listing icon (and other supported extensions -- release notes,
        # readme, docs) to a published package version; see
        # RELEASING.md's "Listing icon" section and
        # docs.upbound.io/manuals/marketplace/packages/#add-documentation-icons-and-other-assets-to-your-package.
        # This repo doesn't sign packages (no cosign step), so there's no
        # append-after-sign ordering concern here. Skipped for unstable
        # main-channel builds since --extensions-root reads from the repo,
        # which is fine for any VERSION -- but only bother for tagged
        # releases users actually browse on the Marketplace.
        if: env.UPBOUND_MARKETPLACE_PUSH_ROBOT_USR != '' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION="$(make build.vars | grep '^VERSION=' | cut -d= -f2)"
          up alpha xpkg append --extensions-root=./extensions \
            "xpkg.upbound.io/cd0486/provider-azuredevops:${VERSION}"

